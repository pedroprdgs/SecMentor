name: Playground · GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/core/**', 'packages/playground/**', 'lessons/**', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secmentor/core build
      - run: pnpm --filter @secmentor/playground build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/playground/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
